openapi: 3.0.3
info:
  title: La Suite Sovereign Sources API (django-lasuite-sources)
  description: >-
    Official OpenAPI 3.0 specification for search, autocomplete, and detail REST endpoints
    covering sovereign data connectors.
  version: 1.0.0
  contact:
    name: Direction Interministérielle du Numérique (DINUM)
    url: https://github.com/suitenumerique/docs

servers:
  - url: /api/v1.0/sources
    description: Local / Production API server

paths:
  /search/:
    get:
      summary: Paginated full-text search across sovereign sources
      description: >-
        Performs full-text search with 24h deterministic Redis caching (SHA-256 key hashing)
        on the specified connector (law, address, company, parliament, albert, etc.).
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - law
              - address
              - company
              - parliament
              - albert
              - procurement
              - grant
              - insee
              - agent
              - cadastre
              - demarche
              - opendata
              - custom
            default: law
          description: Sovereign connector type identifier
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search keywords or query string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 50
          description: Maximum number of results to return
      responses:
        '200':
          description: Matching search results found
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: law
                  query:
                    type: string
                    example: public procurement
                  count:
                    type: integer
                    example: 1
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SourceSearchResult'
        '401':
          description: Unauthorized (user session or JWT token required)

  /suggest/:
    get:
      summary: Fast real-time autocomplete (< 100ms)
      description: >-
        Provides instant as-you-type suggestions to populate the
        BlockNote editor floating Popover search palette.
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            default: law
          description: Sovereign source connector type
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Partial input query prefix
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
            maximum: 20
          description: Maximum suggestions count
      responses:
        '200':
          description: Autocomplete suggestions list
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: law
                  query:
                    type: string
                    example: art
                  suggestions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SourceSuggestResult'

  /{source_type}/{source_id}/:
    get:
      summary: Certified detail entity record
      description: >-
        Retrieves complete metadata, official excerpt, and verified links
        for an entity identified by its unique ID.
      parameters:
        - name: source_type
          in: path
          required: true
          schema:
            type: string
          description: Source connector type (e.g., law, company, address)
        - name: source_id
          in: path
          required: true
          schema:
            type: string
          description: Unique entity identifier (e.g., LEGIARTI000038814944)
      responses:
        '200':
          description: Detailed entity record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSearchResult'
        '404':
          description: Entity or connector not found

components:
  schemas:
    SourceSearchResult:
      type: object
      required:
        - sourceId
        - entityType
        - title
      properties:
        sourceId:
          type: string
          example: LEGIARTI000038814944
        entityType:
          type: string
          example: law
        title:
          type: string
          example: Article L. 111-1 du Code de la commande publique
        subtitle:
          type: string
          example: Code de la commande publique - Titre Ier
        url:
          type: string
          format: uri
          example: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000038814944
        badgeText:
          type: string
          example: In effect
        badgeVariant:
          type: string
          enum: [success, warning, info, neutral, error]
          example: success
        excerpt:
          type: string
          example: Buyers and contracting authorities freely choose the procurement procedure...
        metadata:
          type: object
          additionalProperties: true

    SourceSuggestResult:
      type: object
      required:
        - sourceId
        - title
      properties:
        sourceId:
          type: string
          example: LEGIARTI000038814944
        title:
          type: string
          example: Code de la commande publique - Art. L. 111-1
        subtitle:
          type: string
          example: Légifrance • DILA
        badgeText:
          type: string
          example: Law
        badgeVariant:
          type: string
          example: success
