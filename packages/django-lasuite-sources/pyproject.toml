[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-lasuite-sources"
version = "1.0.0"
description = "Reusable Django application connecting La Suite Numérique to sovereign and public data sources (Légifrance, BAN, BOAMP, Aides-Territoires, INSEE, Albert RAG, etc.)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "waxland" },
]
keywords = [
    "django",
    "lasuite",
    "dinum",
    "sources-souveraines",
    "legifrance",
    "boamp",
    "ban",
    "albert",
    "insee",
    "drf",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "django>=4.2",
    "djangorestframework>=3.14.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/waxland/dinum-setup/tree/main/packages/django-lasuite-sources"
Documentation = "https://github.com/waxland/dinum-setup"
Repository = "https://github.com/waxland/dinum-setup.git"
Issues = "https://github.com/waxland/dinum-setup/issues"

[project.optional-dependencies]
celery = [
    "celery>=5.3.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "fakeredis>=2.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lasuite_sources"]

# -----------------------------------------------------------------------------
# Configuration Qualité & Linting Ruff (Conforme aux standards La Suite Docs)
# Référence : https://github.com/suitenumerique/docs/blob/main/src/backend/pyproject.toml
# -----------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    "dist",
    "build",
    "migrations",
]

[tool.ruff.lint]
select = [
    "B",      # flake8-bugbear
    "BLE",    # blind exceptions (except Exception)
    "C4",     # flake8-comprehensions
    "DJ",     # flake8-django
    "I",      # isort (import sorting)
    "PLC",    # pylint conventions
    "PLE",    # pylint errors
    "PLR",    # pylint refactoring
    "PLW",    # pylint warnings
    "RUF100", # unused noqa
    "RUF200", # pyproject checks
    "S",      # flake8-bandit (security checks)
    "SLF",    # private member access
    "T20",    # print statements detection
]
ignore = [
    "DJ001",  # null=True on text-based fields where appropriate
    "PLR0913", # too many arguments in function definition
]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "django",
    "third-party",
    "first-party",
    "local-folder",
]
known-first-party = ["lasuite_sources"]
extra-standard-library = ["typing_extensions"]

[tool.ruff.lint.isort.sections]
django = ["django", "rest_framework"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "T201"] # Autorise assert, magic numbers et print dans les tests

