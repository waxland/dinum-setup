[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-lasuite-sources"
version = "1.0.0"
description = "Reusable Django application connecting La Suite Numérique to sovereign and public data sources (Légifrance, BAN, BOAMP, Aides-Territoires, INSEE, Albert RAG, etc.)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "DINUM", email = "contact@numerique.gouv.fr" },
]
keywords = [
    "django",
    "lasuite",
    "dinum",
    "sources-souveraines",
    "legifrance",
    "boamp",
    "ban",
    "albert",
    "insee",
    "drf",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "django>=4.2",
    "djangorestframework>=3.14.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
celery = [
    "celery>=5.3.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "fakeredis>=2.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lasuite_sources"]
