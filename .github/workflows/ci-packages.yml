name: CI Packages Souverains

on:
  push:
    paths:
      - 'packages/**'
      - '.github/workflows/ci-packages.yml'
  pull_request:
    paths:
      - 'packages/**'

jobs:
  test-python-package:
    name: Test django-lasuite-sources
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
        django-version: ['4.2', '5.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "django~=${{ matrix.django-version }}.0" djangorestframework requests pytest pytest-django
          pip install -e packages/django-lasuite-sources

      - name: Run pytest
        run: |
          cd packages/django-lasuite-sources
          pytest -v

  test-js-package:
    name: Test @suitenumerique/blocknote-sources
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Typecheck and test blocknote-sources
        run: |
          cd packages/blocknote-sources
          npx tsc --noEmit
          npx vitest run tests/unit/

  test-sdk-package:
    name: Test @suitenumerique/slash-sources-sdk
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Typecheck and test slash-sources-sdk
        run: |
          cd packages/slash-sources-sdk
          npx tsc --noEmit
          npx vitest run tests/
