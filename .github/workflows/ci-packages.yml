name: Quality Gate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.11.0
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e 'packages/django-lasuite-sources[test]' build ruff==0.16.8
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: make check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: |
            packages/blocknote-sources/test-results/
            packages/django-lasuite-sources/.pytest_cache/
          retention-days: 7
