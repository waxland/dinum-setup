name: Publication des Packages Souverains

on:
  push:
    tags:
      - 'v*'

jobs:
  quality:
    uses: ./.github/workflows/ci-packages.yml

  publish-npm:
    needs: quality
    name: Publish npm packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies & Build
        run: |
          npm install --global npm@11.11.0
          npm ci
          npm run packages:build

      - name: Publish slash-sources-sdk
        run: |
          cd packages/slash-sources-sdk
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish blocknote-sources
        run: |
          cd packages/blocknote-sources
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    needs: quality
    name: Publish django-lasuite-sources to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: |
          cd packages/django-lasuite-sources
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/django-lasuite-sources/dist/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
