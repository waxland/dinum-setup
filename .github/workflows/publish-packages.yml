name: Publication des Packages Souverains

on:
  push:
    tags:
      - "v*"

jobs:
  quality:
    uses: ./.github/workflows/ci-packages.yml

  verify-version:
    needs: quality
    name: Verify Tag and Package Version Coherence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify Tag matches package.json and pyproject.toml
        run: node scripts/check-tag-version.mjs "${{ github.ref_name }}"

  publish-npm:
    needs: [quality, verify-version]
    name: Publish npm packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies & Build
        run: |
          npm install --global npm@11.11.0
          npm ci
          npm run packages:build

      - name: Publish slash-sources-sdk
        run: |
          cd packages/slash-sources-sdk
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public
          else
            echo "⚠️ NODE_AUTH_TOKEN not set: dry-run publish"
            npm publish --access public --dry-run
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish blocknote-sources
        run: |
          cd packages/blocknote-sources
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public
          else
            echo "⚠️ NODE_AUTH_TOKEN not set: dry-run publish"
            npm publish --access public --dry-run
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    needs: [quality, verify-version]
    name: Publish django-lasuite-sources to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: |
          cd packages/django-lasuite-sources
          python -m build

      - name: Publish to PyPI
        run: |
          if [ -n "$PYPI_API_TOKEN" ]; then
            python -m twine upload --repository pypi packages/django-lasuite-sources/dist/* -u __token__ -p "$PYPI_API_TOKEN"
          else
            echo "⚠️ PYPI_API_TOKEN not set: dry-run twine check"
            python -m twine check packages/django-lasuite-sources/dist/*
          fi
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
